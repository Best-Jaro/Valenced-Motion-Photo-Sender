name: Build and Release Motion Photo Sender

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout plugin source
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout official Valenced template
        uses: actions/checkout@v4
        with:
          repository: Valenced/valenced-plugin-template
          ref: 9a4f9187137a75d86fe552d0e594889a6e6fd7e5
          path: template

      - name: Install JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Copy both plugin editions into official template
        run: |
          cp -R source/plugins/motion-photo-sender template/plugins/
          cp -R source/plugins/motion-photo-gif-only template/plugins/

      # Packaging tasks share build/dist and clean it when run.
      # Build sequentially and save the first ZIP before building the second.
      - name: Build full and GIF-only plugin ZIPs
        id: compile
        working-directory: template
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.READ_PACKAGES_TOKEN || github.token }}
        run: |
          set -uo pipefail
          set +e
          (
          set -euo pipefail
          chmod +x ./gradlew
          mkdir -p ../release-assets

          ./gradlew --no-daemon packageMotionPhotoSender
          full="build/dist/dev.motion.photo.sender@0.5.4.zip"
          test -s "$full"
          unzip -p "$full" manifest.json | grep -Fq '"name": "Motion Photo Sender"'
          cp "$full" ../release-assets/MotionPhotoSender-Full-v0.5.4.zip

          ./gradlew --no-daemon packageMotionPhotoGifOnly
          gif="build/dist/dev.motion.photo.sender@0.5.4.zip"
          test -s "$gif"
          unzip -p "$gif" manifest.json | grep -Fq '"name": "Motion Photo Sender (GIF Only)"'
          cp "$gif" ../release-assets/MotionPhotoSender-GIF-Only-v0.5.4.zip

          for pkg in ../release-assets/*.zip; do
            unzip -t "$pkg" | tail -n 1
            unzip -Z -1 "$pkg" | grep -Fxq 'index.js'
            unzip -Z -1 "$pkg" | grep -Fxq 'plugin.jar'
            echo "Verified $pkg"
          done
          ) > ../gradle-log.txt 2>&1
          code=$?
          echo "status=$code" >> "$GITHUB_OUTPUT"
          tail -n 70 ../gradle-log.txt
          exit 0

      - name: Publish filtered compiler errors to diagnostics branch
        if: steps.compile.outputs.status != '0'
        working-directory: source
        run: |
          mkdir -p diagnostics
          { grep -Ei '(^e: |error:|FAILURE:|Compilation error|Unresolved reference|Cannot access|Type mismatch|overload resolution ambiguity|TypeScript error)' ../gradle-log.txt || true; tail -n 35 ../gradle-log.txt; } > diagnostics/last-build.txt
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git checkout -B ci-diagnostics
          git add diagnostics/last-build.txt
          git commit -m 'ci: capture compiler errors [skip ci]'
          git push origin HEAD:refs/heads/ci-diagnostics --force
          exit 1

      - name: Save both ZIPs in GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Motion-Photo-Sender-v0.5.4-Both-Editions
          path: release-assets/*.zip
          if-no-files-found: error
          retention-days: 90

      # Publish an actual GitHub Release with two separately named assets.
      # One plugin ID is shared by both editions, so installing one replaces
      # the other instead of enabling conflicting duplicate hooks.
      - name: Publish GitHub Release with both editions
        if: github.ref == 'refs/heads/main'
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v0.5.4"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" ../release-assets/*.zip --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$tag" --notes-file RELEASE_NOTES_v0.5.4.md --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" ../release-assets/*.zip \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Motion Photo Sender v0.5.4 — Full + GIF Only" \
              --notes-file RELEASE_NOTES_v0.5.4.md
          fi
